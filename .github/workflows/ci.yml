name: Masharah Pipeline CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Test Suite (Deterministic Tier 1, Tier 2 & Citation Verification)
      run: |
        pytest tests/ -v

    - name: Run End-to-End Pipeline Dry Run (No API key required)
      run: |
        python poc/demo.py
